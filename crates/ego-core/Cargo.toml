[package]
name = "ego-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arvand"]

[dependencies]
blake2 = "0.10.6"
blake3 = "1.8.2"
ed25519-dalek = "2.2.0"
x25519-dalek = "2.0.1"
rand = { version = "0.8", features = ["getrandom"] }
rand_core = "0.6"
rand_chacha = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
bincode = "2.0.1"
thiserror = "2.0.16"
anyhow = "1.0.99"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
dashmap = "6.1.0"
lru = "0.16.1"
hex = "0.4.3"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
serde-big-array = "0.5.1"
# Portable (clean) PQC builds — the default `avx2`/`aes` features compile
# AVX2/AES-NI native code (SPHINCS+ even on Windows), which crashes on older
# CPUs (e.g. pre-Broadwell Haswell) with ILLEGAL_INSTRUCTION. "std" only.
pqcrypto-kyber = { version = "0.7", default-features = false, features = ["std"] }
pqcrypto-dilithium = { version = "0.4", default-features = false, features = ["std"] }
ml-dsa = "0.0.4"
pqcrypto-sphincsplus = { version = "0.6", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3.5"
bech32 = "0.11.0"
# "portable" forces blst's no-ADX assembly so it runs on CPUs without ADX/MULX.
blst = { version = "0.3", features = ["portable"] }

[dev-dependencies]
tempfile = "3.22.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tps"
harness = false
