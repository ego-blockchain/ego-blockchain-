name: Build & Deploy Ego Relay

on:
  push:
    paths:
      - 'bins/ego-relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Linux x64 + Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build ego-relay (static Linux binary)
        run: cargo build --release --bin ego-relay --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ego-relay-linux
          path: target/x86_64-unknown-linux-musl/release/ego-relay

      - name: Deploy to relay server
        env:
          SSH_KEY:     ${{ secrets.RELAY_SSH_KEY }}
          RELAY_HOST:  ${{ secrets.RELAY_HOST }}
          RELAY_USER:  ${{ secrets.RELAY_USER }}
        if: ${{ env.SSH_KEY != '' }}
        run: |
          echo "$SSH_KEY" > /tmp/relay_key && chmod 600 /tmp/relay_key
          scp -i /tmp/relay_key -o StrictHostKeyChecking=no \
            target/x86_64-unknown-linux-musl/release/ego-relay \
            $RELAY_USER@$RELAY_HOST:/tmp/ego-relay
          ssh -i /tmp/relay_key -o StrictHostKeyChecking=no $RELAY_USER@$RELAY_HOST \
            'sudo mv /tmp/ego-relay /usr/local/bin/ego-relay && sudo chmod +x /usr/local/bin/ego-relay && sudo systemctl restart ego-relay || true'
