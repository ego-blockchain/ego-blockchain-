[package]
name = "ego-rollup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ego-core = { path = "../ego-core" }
serde = { version = "1.0", features = ["derive"] }
bincode = "2.0"
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
libp2p = "0.53"
dashmap = "5.5"
lru = "0.12"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
prometheus = { version = "0.13", optional = true }
reed-solomon-erasure = "6.0"
rand = "0.8"
async-trait = "0.1"
num_cpus = "1.0"
toml = "0.8"
hex = "0.4"
flate2 = "1.0"
serde_json = "1.0"

[features]
default = ["metrics"]
metrics = ["prometheus"]

[dev-dependencies]
tempfile = "3.22.0"
criterion = "0.7.0"
