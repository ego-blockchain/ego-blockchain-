name: Build & Release

# Triggered automatically on version tags (e.g. v0.1.0)
# or manually from the Actions tab via workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  RELEASE_BODY: |
    ## Download

    | Platform | File |
    |----------|------|
    | **Windows** | `Ego Desktop_*_x64_en-US.msi` ← recommended |
    | **Windows** (alt) | `Ego Desktop_*_x64-setup.exe` |
    | **macOS Apple Silicon** (M1/M2/M3/M4) | `Ego Desktop_*_aarch64.dmg` |
    | **macOS Intel** | `Ego Desktop_*_x64.dmg` |

    ### Windows
    1. Download the `.msi` file and run it — follow the installer wizard.

    ### macOS
    1. Download the `.dmg` for your Mac (Apple Silicon = M-chip, Intel = older Mac).
    2. Open it and drag **Ego Desktop** into your Applications folder.
    3. First launch: **right-click the app → Open → Open** (required once since the app is not yet notarized).

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install OpenSSL (Windows)
        run: |
          choco install openssl --no-progress -y
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── macOS Apple Silicon (aarch64 — M1/M2/M3/M4) ──────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest   # macos-latest = Apple Silicon runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (macOS Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          # No --target flag: builds natively on the ARM runner so ring's
          # NEON feature assertions pass without cross-compilation issues.

  # ── macOS Intel (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel
    runs-on: macos-13       # macos-13 = last Intel runner on GitHub Actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (macOS Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          # No --target flag: builds natively on the Intel runner.
