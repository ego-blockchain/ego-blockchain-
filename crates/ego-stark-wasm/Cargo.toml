[package]
name = "ego-stark-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ego-stark = { path = "../ego-stark" }
winterfell = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
