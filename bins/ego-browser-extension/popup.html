<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { background: linear-gradient(135deg, #1e40af, #7c3aed); padding: 16px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.75; margin-top: 1px; }
    .body { padding: 14px; }

    .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .row { display: flex; gap: 6px; margin-bottom: 14px; }
    input {
      flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 7px;
      padding: 8px 10px; color: #e2e8f0; font-size: 13px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    input::placeholder { color: #475569; }
    .btn { border: none; border-radius: 7px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-go  { background: #4f46e5; color: #fff; }
    .btn-go:hover  { background: #4338ca; }
    .btn-add { background: #0f766e; color: #fff; }
    .btn-add:hover { background: #0d6460; }
    .btn-sm  { font-size: 11px; padding: 4px 9px; border-radius: 5px; cursor: pointer; border: none; }

    .node-list { margin-bottom: 14px; }
    .node-item {
      display: flex; align-items: center; gap: 8px;
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 7px 10px; margin-bottom: 5px; font-size: 12px;
    }
    .node-url { flex: 1; font-family: monospace; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #334155; shrink: 0; }
    .dot.online  { background: #10b981; }
    .dot.offline { background: #ef4444; }
    .btn-remove { background: #7f1d1d20; color: #f87171; }
    .btn-remove:hover { background: #7f1d1d50; }
    .btn-sync { background: #1e3a5f; color: #93c5fd; }
    .btn-sync:hover { background: #1e40af50; }

    .divider { border: none; border-top: 1px solid #1e293b; margin: 12px 0; }
    .tip { font-size: 11px; color: #475569; line-height: 1.5; }
    .tip strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Ego Network</h1>
      <p>Decentralized Web Hosting</p>
    </div>
  </div>
  <div class="body">

    <div class="label">Open .eo site</div>
    <div class="row">
      <input type="text" id="siteInput" placeholder="sitename.ego" spellcheck="false" />
      <button class="btn btn-go" id="goBtn">Go</button>
    </div>

    <div class="label">Ego Nodes</div>
    <div class="node-list" id="nodeList"></div>
    <div class="row">
      <input type="text" id="nodeInput" placeholder="http://node-ip:47395" spellcheck="false" />
      <button class="btn btn-add" id="addBtn">Add</button>
    </div>

    <hr class="divider">
    <div class="tip">
      Each node in the list serves <strong>.eo sites</strong> it has stored.
      Add IP addresses of friends running Ego Desktop to extend the network.
      <br><br>
      <strong>.ego</strong> is Ego's decentralized TLD on the Handshake blockchain.
      Works natively in <strong>Brave browser</strong> with zero setup.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
