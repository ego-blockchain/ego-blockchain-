[package]
name = "ego-evm"
version = "0.1.0"
edition = "2021"

[dependencies]
revm = { version = "8", default-features = false, features = ["std", "optional_balance_check"] }
ego-core = { path = "../ego-core" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
