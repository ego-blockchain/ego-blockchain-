worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;

  # ── Upstream: round-robin across all four validators ──────────────────────
  upstream ego_rpc {
    least_conn;
    server validator1:8545 max_fails=3 fail_timeout=10s;
    server validator2:8545 max_fails=3 fail_timeout=10s;
    server validator3:8545 max_fails=3 fail_timeout=10s;
    server validator4:8545 max_fails=3 fail_timeout=10s;
  }

  # ── Main server ───────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Global CORS headers
    add_header Access-Control-Allow-Origin  *  always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Handle pre-flight OPTIONS requests
    if ($request_method = OPTIONS) {
      return 204;
    }

    # Proxy timeouts (shared)
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── / → static network info ─────────────────────────────────────────────
    location = / {
      return 200 '{"name":"Ego Testnet","chain_id":1399,"rpc":"http://rpc.egoblockchain.com"}';
      add_header Content-Type application/json always;
    }

    # ── /rpc → load-balanced RPC ────────────────────────────────────────────
    location /rpc {
      proxy_pass http://ego_rpc;
    }

    # ── /health → validator1 health ─────────────────────────────────────────
    location = /health {
      proxy_pass http://validator1:8545/health;
    }

    # ── /faucet → validator1 faucet (preserve query string) ─────────────────
    location = /faucet {
      proxy_pass http://validator1:8545/faucet?$query_string;
    }

    # ── /chain/blocks → load-balanced ───────────────────────────────────────
    location = /chain/blocks {
      proxy_pass http://ego_rpc;
    }

    # ── /balance/ → load-balanced ───────────────────────────────────────────
    location /balance/ {
      proxy_pass http://ego_rpc;
    }

    # ── /tx/ → load-balanced ────────────────────────────────────────────────
    location /tx/ {
      proxy_pass http://ego_rpc;
    }
  }
}
