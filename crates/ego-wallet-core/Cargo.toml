[package]
name = "ego-wallet-core"
description = "Wallet keys and addresses shared by Ego Desktop and the iPhone wallet"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

# Same versions as ego-desktop, so both derive byte-identical addresses.
[dependencies]
aes-gcm = "0.10"
bech32 = "0.9"
blake3 = "1"
ego-stark = { path = "../ego-stark" }
getrandom = "0.2"
blake2 = "0.10"
bs58 = "0.5"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
# Only to check our Bitcoin transactions independently; not in the library.
bitcoin = "0.32"
winterfell = "0.10"
