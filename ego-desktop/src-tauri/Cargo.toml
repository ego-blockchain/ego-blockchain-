[package]
name = "ego-desktop"
version = "0.1.0"
description = "Ego Desktop - Quantum-Safe Blockchain"
authors = ["Ego Blockchain Team"]
license = "MIT"
repository = "https://github.com/ego-blockchain/ego-desktop"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "http-request",
    "clipboard-write-text", "process-relaunch", "clipboard-read-text",
    "os-all", "dialog-message", "window-unmaximize", "window-show",
    "shell-open", "dialog-ask", "window-hide", "dialog-confirm",
    "fs-all", "window-start-dragging", "window-maximize", "process-exit",
    "notification-all", "dialog-save", "dialog-open", "window-close",
    "path-all", "window-unminimize", "system-tray", "window-minimize",
    "icon-png"
] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
qrcode = "0.12"
base64 = "0.21"
bech32 = "0.9"

# Ego Blockchain dependencies
ego-core        = { path = "../../crates/ego-core" }
ego-vm          = { path = "../../crates/ego-vm" }
ego-rollup      = { path = "../../crates/ego-rollup" }
urego-compiler  = { path = "../../crates/urego-compiler" }

# Mempool / rollup
once_cell = "1.19"
blst = "0.3"
rayon = "1.10"

# Multi-chain address derivation
k256          = { version = "0.13", features = ["ecdsa"] }
sha2          = "0.10"
sha3          = "0.10"
ripemd        = "0.1"
hmac          = "0.12"
bs58          = "0.5"
ed25519-dalek = "2"
x25519-dalek  = { version = "2", features = ["static_secrets"] }
blake2        = "0.10"

# File system and encryption
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1.6", features = ["derive"] }
hex = "0.4"
blake3 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }  # kept for one-time SQLite→RocksDB migration
rocksdb  = "0.22.0"
bincode  = { version = "2.0.1", features = ["serde"] }
dirs = "5.0"
fs2  = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

opener = "0.6"
sysinfo = "0.30"
local-ip-address = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
hyper   = { version = "0.14", features = ["http1", "http2", "server"] }
# JSON-RPC + WebSocket server — external devs / JS SDK connect here
axum        = { version = "0.6", features = ["ws"] }
axum-server = { version = "0.5", features = ["tls-rustls"] }
tower       = "0.4"
rcgen       = "0.12"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
libp2p-core = "0.43"
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "quic", "dns", "noise", "yamux",
    "identify", "dcutr", "autonat", "relay",
    "request-response", "ping", "macros", "ed25519",
    "gossipsub", "kad",
] }

keyring = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase", "dwmapi", "windef"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Use FASTLINK PDB mode to avoid MSVC LNK1318 type-record limit on large binaries.
[profile.dev]
debug = false
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.pqcrypto-dilithium]
opt-level = 3

[profile.dev.package.pqcrypto-kyber]
opt-level = 3

[profile.dev.package.pqcrypto-sphincsplus]
opt-level = 3

[profile.dev.package.ego-core]
opt-level = 3

# Prevent src-tauri from joining the parent ego-blockchain workspace.
[dev-dependencies]
tempfile = "3"

[workspace]
