[package]
name = "ego-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ego-core = { path = "../ego-core" }

# Core dependencies
anyhow.workspace = true
thiserror = "2.0.16"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
bincode = "2.0.1"
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
tracing = "0.1.41"
rand = "0.9.2"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
libp2p = { version = "0.56.0", features = ["tcp", "mdns", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "macros", "tokio", "autonat"] }
blake3 = "1.8.2"
blake2 = "0.10"
ed25519-dalek = "2.2.0"
dashmap = "6.1.0"
lru = "0.16.1"
lz4 = "1.28.1"
geo = "0.31.0"
rocksdb = "0.22.0"

[dev-dependencies]
tempfile = "3.22.0"
tokio-test = "0.4.4"

[features]
default = ["full-validation"]
full-validation = []
fast-sync = []
testing = []
