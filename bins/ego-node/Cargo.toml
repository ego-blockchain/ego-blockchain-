[package]
name = "ego-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.41", features = ["serde"] }
flate2 = "1.1.2"
thiserror = "2.0.16"
serde_json = "1.0.143"
rand = "0.9.2"
