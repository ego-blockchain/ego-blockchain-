name: EgoWallet
options:
  bundleIdPrefix: com.egoblockchain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  EgoKit:
    path: EgoKit
targets:
  EgoWallet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EgoWallet
    dependencies:
      - package: EgoKit
        product: EgoKit
    settings:
      base:
        PRODUCT_NAME: EgoWallet
        PRODUCT_BUNDLE_IDENTIFIER: com.egoblockchain.wallet
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ego Wallet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: Ego Wallet uses Face ID to unlock your wallet and to show your recovery phrase.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
