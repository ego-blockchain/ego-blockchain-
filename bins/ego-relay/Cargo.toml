[package]
name    = "ego-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ego-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio  = { version = "1", features = ["full"] }
libp2p = { version = "0.56", features = [
    "noise", "yamux", "tcp", "dns",
    "relay", "identify", "kad", "ping",
    "tokio", "macros",
] }
futures      = "0.3"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
