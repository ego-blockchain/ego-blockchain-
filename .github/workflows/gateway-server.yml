name: Deploy Server Gateway

# Builds headless Ego Desktop for Linux and installs it on the oracle server as
# an always-on phone gateway (testnet/gateway-server.sh does the server side).

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TARGET_DIR: ${{ github.workspace }}/ego-desktop/src-tauri/target

jobs:
  build-and-deploy:
    name: Build Linux x64 + Deploy
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev clang lld llvm

      - name: Install frontend dependencies
        working-directory: ego-desktop
        run: npm install

      - name: Fetch Rust deps + patch wry for webkit2gtk 0.18.2
        working-directory: ego-desktop/src-tauri
        run: |
          cargo fetch
          WRY=$(find ~/.cargo/registry/src -path "*/wry-*/src/webview/webkitgtk/mod.rs" 2>/dev/null | head -1)
          if [ -n "$WRY" ]; then
            sed -i 's/use webkit2gtk::{/use webkit2gtk::{SettingsExt, /' "$WRY"
          fi

      - name: Build frontend
        working-directory: ego-desktop
        run: npm run build

      - name: Test gateway
        working-directory: ego-desktop/src-tauri
        run: cargo test --release --bin ego-desktop gateway::

      - name: Build ego-desktop
        working-directory: ego-desktop/src-tauri
        run: cargo build --release --bin ego-desktop

      - name: Deploy to oracle server
        env:
          SSH_KEY:    ${{ secrets.RELAY_SSH_KEY }}
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
          RELAY_USER: ${{ secrets.RELAY_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/oracle_key && chmod 600 /tmp/oracle_key
          scp -i /tmp/oracle_key -o StrictHostKeyChecking=no \
            "$CARGO_TARGET_DIR/release/ego-desktop" testnet/gateway-server.sh \
            $RELAY_USER@$RELAY_HOST:/tmp/
          ssh -i /tmp/oracle_key -o StrictHostKeyChecking=no $RELAY_USER@$RELAY_HOST \
            'sudo bash /tmp/gateway-server.sh /tmp/ego-desktop; s=$?; rm -f /tmp/ego-desktop /tmp/gateway-server.sh; exit $s'

      - name: Wait for the bootstrap list
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -m 10 https://rpc.egoblockchain.com/gateways | grep -q '"endpoint"'; then
              echo "The bootstrap list has a gateway."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::The gateway runs but isn't on the bootstrap list yet. Check the server's logs and that TCP 47398 is allowed in Oracle Cloud's security list."
