[package]
name = "ego-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ego-core = { path = "../../crates/ego-core" }
ego-rollup = { path = "../../crates/ego-rollup" }
ego-consensus = { path = "../../crates/ego-consensus" }
ego-vm = { path = "../../crates/ego-vm" }

axum = { version = "0.7", features = ["json"] }
async-trait = "0.1"
tower-http = { version = "0.5", features = ["cors"] }

anyhow.workspace = true
flate2 = "1.1.2"
thiserror = "2.0"
serde_json = "1.0.143"
rand = "0.9.2"
rayon = "1.10"
clap = "4.5.47"
libp2p = { version = "0.56.0", features = ["tcp", "mdns", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "macros", "tokio", "autonat", "dcutr", "relay"] }
bincode = "2.0.1"
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = { version = "1.7.0", features = ["zeroize_derive"] }
argon2 = { version = "0.5", features = ["std"] }
sysinfo = "0.31"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
getrandom  = "0.2"
rocksdb = "0.22"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.21.0"
env_logger = "0.11.8"

[[bin]]
name = "ego-node"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[features]
default = ["full-node"]
full-node = []
validator-only = []
storage-only = []
gateway-only = []
