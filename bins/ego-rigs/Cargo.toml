[package]
name = "ego-rigs"
version = "0.1.0"
edition = "2021"
description = "One terminal view of the EGOC earned by all your Ego Desktop computers"

[[bin]]
name = "ego-rigs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
colored = "2"
