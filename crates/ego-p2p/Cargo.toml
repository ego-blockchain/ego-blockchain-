[package]
name = "ego-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ego-core = { path = "../ego-core" }

libp2p = { version = "0.56.0", features = [
    "tcp",
    "tokio",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "autonat",
    "mdns",
    "relay",
    "dcutr",
    "upnp",
    "macros",
    "quic",
    "dns",
] }

tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
tracing = "0.1.41"
anyhow = "1.0.99"
thiserror = "2.0.16"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
bincode = "2.0.1"
dashmap = "6.1.0"
lru = "0.16.1"
rand = "0.9.2"
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1.87"

[dev-dependencies]
tempfile = "3.22.0"
tokio-test = "0.4.4"

[features]
default = []
mdns-local = ["libp2p/mdns"]
