name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_BODY: |
    ## Download

    | Platform | File |
    |----------|------|
    | **Windows** | `Ego Desktop_*_x64_en-US.msi` ← recommended |
    | **Windows** (alt) | `Ego Desktop_*_x64-setup.exe` |
    | **macOS** (M1/M2/M3/M4) | `Ego Desktop_*_aarch64.dmg` |
    | **macOS** (Intel) | `Ego Desktop_*_x64.dmg` |
    | **Linux** (Debian/Ubuntu) | `Ego Desktop_*_amd64.deb` |
    | **Linux** (universal) | `Ego Desktop_*_amd64.AppImage` |

    ### Windows
    1. Download the `.msi` file and run it — follow the installer wizard.

    ### macOS
    1. Download the `.dmg` file.
    2. Open it and drag **Ego Desktop** into your Applications folder.
    3. First launch: **right-click the app → Open → Open** (required once since the app is not yet notarized).

    ### Linux
    1. **Debian/Ubuntu**: `sudo dpkg -i Ego.Desktop_*_amd64.deb`
    2. **AppImage**: `chmod +x Ego.Desktop_*_amd64.AppImage && ./Ego.Desktop_*_amd64.AppImage`

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── macOS Apple Silicon (aarch64 — M1/M2/M3/M4) ──────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (macOS Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: '-C target-cpu=apple-m1'
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── Linux (x64 — .deb + .AppImage) ───────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            musl-tools \
            clang \
            llvm

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Fetch Rust deps + patch wry for webkit2gtk 0.18.2
        working-directory: ego-desktop-mvp/src-tauri
        run: |
          cargo fetch
          # wry 0.24.x calls webkit2gtk::Settings methods without importing
          # SettingsExt, which moved those methods in webkit2gtk 0.18.2.
          # Patch the extracted source in the registry cache directly.
          WRY=$(find ~/.cargo/registry/src -path "*/wry-*/src/webview/webkitgtk/mod.rs" 2>/dev/null | head -1)
          if [ -n "$WRY" ]; then
            sed -i 's/use webkit2gtk::{/use webkit2gtk::{SettingsExt, /' "$WRY"
            echo "Patched $WRY"
          fi

      - name: Build (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
        with:
          projectPath: ego-desktop-mvp
          args: --target x86_64-unknown-linux-gnu
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false