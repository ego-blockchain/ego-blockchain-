name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0) — leave empty to build without releasing'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_BODY: |
    ## Download

    | Platform | File |
    |----------|------|
    | **Windows** | `Ego Desktop_*_x64_en-US.msi` ← recommended |
    | **Windows** (alt) | `Ego Desktop_*_x64-setup.exe` |
    | **macOS** (M1/M2/M3/M4) | `Ego Desktop_*_aarch64.dmg` |
    | **macOS** (Intel) | `Ego Desktop_*_x64.dmg` |
    | **Linux** (Debian/Ubuntu) | `Ego Desktop_*_amd64.deb` |
    | **Linux** (universal) | `Ego Desktop_*_amd64.AppImage` |

    ### Windows
    1. Download the `.msi` file and run it — follow the installer wizard.

    ### macOS
    1. Download the `.dmg` file.
    2. Open it and drag **Ego Desktop** into your Applications folder.
    3. First launch: **right-click the app → Open → Open** (required once since the app is not yet notarized).

    ### Linux
    1. **Debian/Ubuntu**: `sudo dpkg -i Ego.Desktop_*_amd64.deb`
    2. **AppImage**: `chmod +x Ego.Desktop_*_amd64.AppImage && ./Ego.Desktop_*_amd64.AppImage`

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install llvm-tools (rust-lld linker)
        run: rustup component add llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop
        run: npm install

      - name: Build (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
        with:
          projectPath: ego-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseName: Ego Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── macOS Apple Silicon (aarch64 — M1/M2/M3/M4) ──────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop
        run: npm install

      - name: Build (macOS Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: '-C target-cpu=apple-m1'
        with:
          projectPath: ego-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseName: Ego Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── Linux (x64 — .deb + .AppImage) ───────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            lld \
            llvm \
            musl-dev \
            musl-tools

          # @tauri-apps/cli v1 forces x86_64-unknown-linux-musl for AppImage builds.
          # cc-rs needs a C++ compiler named exactly "x86_64-linux-musl-g++".
          # Provide clang++ as a wrapper — it supports the musl target natively.
          sudo tee /usr/local/bin/x86_64-linux-musl-g++ > /dev/null << 'WRAPPER'
          #!/bin/sh
          exec clang++ --target=x86_64-linux-musl -isystem /usr/include/x86_64-linux-musl "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/x86_64-linux-musl-g++

          sudo tee /usr/local/bin/x86_64-linux-musl-gcc > /dev/null << 'WRAPPER'
          #!/bin/sh
          exec clang --target=x86_64-linux-musl -isystem /usr/include/x86_64-linux-musl "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/x86_64-linux-musl-gcc

          # Also provide llvm-ar as the archiver for musl builds
          sudo ln -sf /usr/bin/llvm-ar /usr/local/bin/x86_64-linux-musl-ar 2>/dev/null || true

      - name: Add musl Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install frontend dependencies
        working-directory: ego-desktop
        run: npm install

      - name: Fetch Rust deps + patch wry for webkit2gtk 0.18.2
        working-directory: ego-desktop/src-tauri
        run: |
          cargo fetch
          WRY=$(find ~/.cargo/registry/src -path "*/wry-*/src/webview/webkitgtk/mod.rs" 2>/dev/null | head -1)
          if [ -n "$WRY" ]; then
            sed -i 's/use webkit2gtk::{/use webkit2gtk::{SettingsExt, /' "$WRY"
            echo "Patched $WRY"
          fi

      - name: Build frontend
        working-directory: ego-desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: ego-desktop
        env:
          EGO_AI_KEY: ${{ secrets.EGO_AI_KEY }}
        run: npx tauri build

      - name: Upload Linux artifacts to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Ego Desktop ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            ego-desktop/src-tauri/target/x86_64-unknown-linux-musl/release/bundle/appimage/*.AppImage
            ego-desktop/src-tauri/target/x86_64-unknown-linux-musl/release/bundle/deb/*.deb