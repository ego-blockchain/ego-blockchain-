<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site not found — Ego Network</title>
  <style>
    body {
      background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
    }
    .card {
      text-align: center; max-width: 420px; padding: 48px 32px;
      background: #1e293b; border: 1px solid #334155; border-radius: 20px;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .site { color: #a5b4fc; font-family: monospace; font-size: 18px; font-weight: 600; }
    .hint { font-size: 12px; color: #475569; line-height: 1.7; }
    a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Site not found</h1>
    <div class="site" id="siteName"></div>
    <p style="margin-top:12px">No Ego node in your list has this site online right now.</p>
    <div class="hint">
      • The site owner's Ego Desktop may be offline<br>
      • Add more nodes via the <a href="#" id="openPopup">Ego extension</a><br>
      • The site name may not exist on the network
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const site = params.get("site") || "";
    document.getElementById("siteName").textContent = site ? site + ".eo" : "";
    document.getElementById("openPopup").onclick = (e) => {
      e.preventDefault();
      chrome.runtime.sendMessage({ type: "open_popup" });
    };
  </script>
</body>
</html>
