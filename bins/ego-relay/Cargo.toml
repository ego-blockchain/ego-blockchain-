[package]
name    = "ego-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ego-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio  = { version = "1", features = ["full"] }
libp2p = { version = "0.56", features = [
    "noise", "yamux", "tcp", "dns",
    "relay", "identify", "kad", "ping",
    "tokio", "macros",
] }
futures      = "0.3"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# HTTP mailbox + hosting gateway
axum        = "0.7"
axum-server = { version = "0.6", features = ["tls-rustls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
blake3     = "1"
rocksdb    = "0.22.0"
rcgen      = "0.12"
base64     = "0.22"
chrono     = { version = "0.4", features = ["serde"] }
tokio-rustls = "0.26"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
