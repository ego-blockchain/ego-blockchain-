[workspace]

[package]
name = "ego-oracle"
version = "1.0.0"
edition = "2021"
description = "Ego Blockchain oracle price feed — serves real-time crypto prices via REST API on port 8547"

[[bin]]
name = "ego-oracle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
once_cell     = "1"
anyhow        = "1"
instant-acme  = "0.7"
rcgen         = "0.11"
