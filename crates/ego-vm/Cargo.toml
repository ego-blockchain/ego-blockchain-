[package]
name    = "ego-vm"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime   = { version = "25", features = ["cranelift"] }
anyhow     = "1"
thiserror  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
hex        = "0.4"
blake2     = { version = "0.10" }
blake3     = "1"
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"
ed25519-dalek = "2"
rand       = "0.8"
rayon      = "1"
revm       = { version = "8.0.0", default-features = false, features = ["std", "serde"] }
