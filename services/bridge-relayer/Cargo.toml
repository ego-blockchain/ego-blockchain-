[package]
name        = "ego-bridge-relayer"
version     = "1.0.0"
edition     = "2021"
description = "EGO-10 bridge relayer — watches Ethereum lock events, submits verify_and_mint to Ego"

[dependencies]
tokio        = { version = "1", features = ["full"] }
axum         = "0.7"
reqwest      = { version = "0.12", features = ["json"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
sha2         = "0.10"
chrono       = "0.4"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http   = { version = "0.5", features = ["cors"] }
once_cell    = "1"
clap         = { version = "4", features = ["derive"] }
anyhow       = "1"
