[package]
name = "ego-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arvand"]

[dependencies]
blake2 = "0.10.6"
blake3 = "1.8.2"
ed25519-dalek = "2.2.0"
x25519-dalek = "2.0.1"
rand = { version = "0.8", features = ["getrandom"] }
rand_core = "0.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
bincode = "2.0.1"
thiserror = "2.0.16"
anyhow = "1.0.99"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"
libp2p = { version = "0.56.0", features = ["identify"] }
dashmap = "6.1.0"
lru = "0.16.1"
hex = "0.4.3"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
serde-big-array = "0.5.1"
pqcrypto-kyber = "0.8.1"
pqcrypto-dilithium = "0.5.0"
pqcrypto-sphincsplus = "0.7.2"
pqcrypto-traits = "0.3.5"

[dev-dependencies]
tempfile = "3.22.0"
criterion = "0.7.0"
