name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    ## Download

    | Platform | File |
    |----------|------|
    | **Windows** | `Ego Desktop_*_x64_en-US.msi` ← recommended |
    | **Windows** (alt) | `Ego Desktop_*_x64-setup.exe` |
    | **macOS** (M1/M2/M3/M4) | `Ego Desktop_*_aarch64.dmg` |
    | **macOS** (Intel) | `Ego Desktop_*_x64.dmg` |

    ### Windows
    1. Download the `.msi` file and run it — follow the installer wizard.

    ### macOS
    1. Download the `.dmg` file.
    2. Open it and drag **Ego Desktop** into your Applications folder.
    3. First launch: **right-click the app → Open → Open** (required once since the app is not yet notarized).

jobs:
  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  # ── macOS Apple Silicon (aarch64 — M1/M2/M3/M4) ──────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ego-desktop-mvp/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ego-desktop-mvp
        run: npm install

      - name: Build (macOS Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: '-C target-cpu=apple-m1'
        with:
          projectPath: ego-desktop-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Ego Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
